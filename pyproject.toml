[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ibm-article-recommender"
version = "1.0.0"
description = "Deterministic implicit-feedback recommenders for the IBM article dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
]

[project.optional-dependencies]
notebook = [
  "jupyter>=1.0",
  "matplotlib>=3.8",
  "nltk>=3.8",
  "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
include = ["ibm_recommender*"]
